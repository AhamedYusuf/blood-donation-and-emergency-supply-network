name: Web CI

on:
  push:
    branches:
      - development
      - production
      - "dev/**"
      - "chore/**"
  pull_request:
    branches:
      - development
      - production

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # vitest@5 and jsdom@30 both require Node 22.12+/24+/26+ — Node 20
          # isn't in either package's supported range at all, which is why
          # this job failed on 20.x even though everything passed locally
          # (this machine runs Node 26).
          node-version: "26.x"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
