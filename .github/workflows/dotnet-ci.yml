name: .NET CI

on:
  push:
    branches:
      - development
      - production
      - "dev/**"
      - "chore/**"

  pull_request:
    branches:
      - development
      - production

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/src/BloodDonationNetwork.Api/BloodDonationNetwork.Api.csproj

      - name: Build
        run: dotnet build backend/src/BloodDonationNetwork.Api/BloodDonationNetwork.Api.csproj --no-restore --configuration Release

      - name: Test
  run: dotnet test backend/tests/BloodDonationNetwork.Tests/BloodDonationNetwork.Tests.csproj --configuration Release --no-restore