# Render Blueprint — deploys the ASP.NET Core API, PostgreSQL database,
# agent service and React static site required by Assignment 1 Section 14.
#
# Also deploys the Python agent-service (LangGraph Coordinator). Without
# it, blood requests are saved but no agent workflow runs in the cloud.
# It needs no LLM: the agents decide with fixed rules in the API.
#
# To apply: Render dashboard -> New -> Blueprint -> connect this repo,
# point it at this file (infra/render.yaml). See the deployment section
# of the README for the manual steps (setting secret env vars, etc.)
# this file can't fully automate on its own.

databases:
  - name: blood-donation-db
    databaseName: blood_donation
    user: blood_donation
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------
  # ASP.NET Core API
  # ---------------------------------------------------------------
  - type: web
    name: blood-donation-api
    env: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Assembled into a proper Npgsql connection string in Program.cs —
      # Render's own combined connectionString property is a postgres://
      # URI, which Npgsql's parser rejects outright.
      - key: Database__Host
        fromDatabase:
          name: blood-donation-db
          property: host
      - key: Database__Port
        fromDatabase:
          name: blood-donation-db
          property: port
      - key: Database__Name
        fromDatabase:
          name: blood-donation-db
          property: database
      - key: Database__User
        fromDatabase:
          name: blood-donation-db
          property: user
      - key: Database__Password
        fromDatabase:
          name: blood-donation-db
          property: password

      - key: Jwt__Issuer
        value: BloodDonationNetwork
      - key: Jwt__Audience
        value: BloodDonationNetworkUsers
      # Render generates and stores a random value the first time this
      # is applied — nothing to type in for this one.
      - key: Jwt__Key
        generateValue: true

      # Only used server-to-server if you ever point a deployed
      # agent-service call at this backend; harmless to auto-generate
      # since the local agent-service talks to your LOCAL backend, not
      # this one, in the normal (recommended) setup.
      - key: InternalAgentSecret
        generateValue: true

      # No safe default is possible for these two (see Program.cs) — set
      # in the Render dashboard's Environment tab after the blueprint is
      # created, or Render will prompt for them during Blueprint setup.
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false

      # Public URL of the blood-donation-agent service below. Render adds a
      # random suffix to the name, so the URL is only known after the agent
      # service exists: copy it from the dashboard and paste it here (e.g.
      # https://blood-donation-agent-xxxx.onrender.com). Without it the API
      # falls back to localhost:8000, blood requests are saved but no agent
      # workflow ever starts.
      - key: AgentService__BaseUrl
        sync: false

      # Nominatim (the free OpenStreetMap geocoder this originally used)
      # actively blocks/rate-limits cloud-provider IP ranges — confirmed
      # live, every address failed to geocode once deployed here even
      # though the same address resolved fine from a residential
      # network. LocationIQ is Nominatim-compatible but built to accept
      # normal app traffic from hosts like this one. Free-tier API key
      # from locationiq.com — paste it in via the dashboard, not here.
      - key: LocationIq__ApiKey
        sync: false

  # ---------------------------------------------------------------
  # Python agent service (FastAPI + LangGraph Coordinator)
  # ---------------------------------------------------------------
  - type: web
    name: blood-donation-agent
    env: docker
    plan: free
    region: oregon
    rootDir: agent-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: BACKEND_BASE_URL
        value: https://blood-donation-api-h3cp.onrender.com

      # Must equal the API's own generated secret: every call between the
      # two services carries it in X-Internal-Secret, in both directions.
      - key: INTERNAL_AGENT_SECRET
        fromService:
          type: web
          name: blood-donation-api
          envVarKey: InternalAgentSecret

      # Paused workflows (waiting for human approval) are checkpointed here.
      # The free plan stops this service after ~15 idle minutes; without a
      # database checkpoint every approval after that fails with "not found".
      - key: CHECKPOINT_DATABASE_URL
        fromDatabase:
          name: blood-donation-db
          property: connectionString

  # ---------------------------------------------------------------
  # React web app (static site)
  # ---------------------------------------------------------------
  - type: web
    name: blood-donation-web
    env: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Vite bakes this in at BUILD time, not runtime. The plain name
      # above (blood-donation-api.onrender.com) was already taken
      # globally on Render, so it assigned a random suffix instead —
      # this is the real, confirmed URL (verified via /health and
      # /swagger both returning 200). If the service is ever recreated
      # under a fresh name, update this value and trigger Manual Deploy
      # -> Clear build cache & deploy — editing the running service's
      # env var alone won't rebuild the already-baked-in JS.
      - key: VITE_API_BASE_URL
        value: https://blood-donation-api-h3cp.onrender.com/api

      # The browser pings this service's /health while staff use the app.
      # The agent sleeps when idle and a call from the API does not wake it,
      # but a request from outside Render does (see wakeAgentService.ts).
      - key: VITE_AGENT_BASE_URL
        value: https://blood-donation-agent.onrender.com
    routes:
      # React Router client-side routes (e.g. /appointments) must all
      # serve index.html, or a page refresh on any non-root route 404s.
      - type: rewrite
        source: /*
        destination: /index.html
