# Render Blueprint — deploys the ASP.NET Core API, PostgreSQL database,
# and React static site required by Assignment 1 Section 14.
#
# The Python agent-service is intentionally NOT deployed here — Section
# 14's table explicitly allows it to "deploy or run locally as
# appropriate," and it depends on a local Ollama model anyway. It stays
# on the student's machine; see backend/README (or the deployment
# report) for local startup instructions.
#
# To apply: Render dashboard -> New -> Blueprint -> connect this repo,
# point it at this file (infra/render.yaml). See the deployment section
# of the README for the manual steps (setting secret env vars, etc.)
# this file can't fully automate on its own.

databases:
  - name: blood-donation-db
    databaseName: blood_donation
    user: blood_donation
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------
  # ASP.NET Core API
  # ---------------------------------------------------------------
  - type: web
    name: blood-donation-api
    env: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Assembled into a proper Npgsql connection string in Program.cs —
      # Render's own combined connectionString property is a postgres://
      # URI, which Npgsql's parser rejects outright.
      - key: Database__Host
        fromDatabase:
          name: blood-donation-db
          property: host
      - key: Database__Port
        fromDatabase:
          name: blood-donation-db
          property: port
      - key: Database__Name
        fromDatabase:
          name: blood-donation-db
          property: database
      - key: Database__User
        fromDatabase:
          name: blood-donation-db
          property: user
      - key: Database__Password
        fromDatabase:
          name: blood-donation-db
          property: password

      - key: Jwt__Issuer
        value: BloodDonationNetwork
      - key: Jwt__Audience
        value: BloodDonationNetworkUsers
      # Render generates and stores a random value the first time this
      # is applied — nothing to type in for this one.
      - key: Jwt__Key
        generateValue: true

      # Only used server-to-server if you ever point a deployed
      # agent-service call at this backend; harmless to auto-generate
      # since the local agent-service talks to your LOCAL backend, not
      # this one, in the normal (recommended) setup.
      - key: InternalAgentSecret
        generateValue: true

      # No safe default is possible for these two (see Program.cs) — set
      # in the Render dashboard's Environment tab after the blueprint is
      # created, or Render will prompt for them during Blueprint setup.
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false

  # ---------------------------------------------------------------
  # React web app (static site)
  # ---------------------------------------------------------------
  - type: web
    name: blood-donation-web
    env: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Vite bakes this in at BUILD time, not runtime. The plain name
      # above (blood-donation-api.onrender.com) was already taken
      # globally on Render, so it assigned a random suffix instead —
      # this is the real, confirmed URL (verified via /health and
      # /swagger both returning 200). If the service is ever recreated
      # under a fresh name, update this value and trigger Manual Deploy
      # -> Clear build cache & deploy — editing the running service's
      # env var alone won't rebuild the already-baked-in JS.
      - key: VITE_API_BASE_URL
        value: https://blood-donation-api-h3cp.onrender.com/api
    routes:
      # React Router client-side routes (e.g. /appointments) must all
      # serve index.html, or a page refresh on any non-root route 404s.
      - type: rewrite
        source: /*
        destination: /index.html
