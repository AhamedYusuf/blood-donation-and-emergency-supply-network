services:

  postgres:
    image: postgres:16
    container_name: blood-donation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blood_donation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  agent-service:
    build:
      context: ../agent-service
    container_name: blood-donation-agent-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
